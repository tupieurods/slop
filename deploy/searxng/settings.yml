use_default_settings: true

server:
  secret_key: "slop-searxng-internal-key"
  bind_address: "0.0.0.0"
  port: 8080

general:
  enable_metrics: false

search:
  default_lang: "en"
  safe_search: 0
  formats:
    - html
    - json

engines:
  - name: duckduckgo
    disabled: false
  - name: duckduckgo images
    disabled: false
  - name: brave
    disabled: false
  - name: brave.images
    disabled: false
  - name: qwant
    disabled: false
  - name: qwant images
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
  - name: mojeek
    disabled: false
  - name: startpage
    disabled: false

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20
  useragent_suffix: "slop-searxng"

